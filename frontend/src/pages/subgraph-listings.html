<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subgraph Listings</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .subgraph {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
        }
        .book-btn {
            background-color: #4CAF50;
            color: white;
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Available Subgraphs</h1>
    <div id="subgraphs">
        <!-- Subgraphs will be dynamically loaded here -->
    </div>

    <script>
        const subgraphs = [
            { name: 'Users', description: 'Manage user profiles and authentication', available: true },
            { name: 'Temple', description: 'Book temple services and offerings', available: true },
            { name: 'Reviews', description: 'Read and write reviews', available: true },
            { name: 'Profiles', description: 'View and edit user profiles', available: true },
            { name: 'Locations', description: 'Find and book locations', available: true },
            { name: 'Payments', description: 'Process payments securely', available: true },
            { name: 'Listings', description: 'Browse and book listings', available: true },
            { name: 'Carts', description: 'Manage shopping carts', available: true },
            { name: 'Bookings', description: 'Manage your bookings', available: true }
        ];

        const container = document.getElementById('subgraphs');
        subgraphs.forEach(subgraph => {
            const div = document.createElement('div');
            div.className = 'subgraph';
            div.innerHTML = `
                <h3>${subgraph.name}</h3>
                <p>${subgraph.description}</p>
                <button class="book-btn" onclick="bookSubgraph('${subgraph.name}')" ${!subgraph.available ? 'disabled' : ''}>
                    ${subgraph.available ? 'Book Now' : 'Unavailable'}
                </button>
            `;
            container.appendChild(div);
        });

        function bookSubgraph(name) {
            alert(`Booking ${name} subgraph. Redirecting to booking form...`);
            // Redirect to booking form
            window.location.href = `booking-form.html?subgraph=${encodeURIComponent(name)}`;
        }
    </script>
</body>
</html>
