<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listing</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .item {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
        }
        .item h3 {
            margin-top: 0;
        }
    </style>
</head>
<body>
    <h1>Listing</h1>
    <div id="items">
        <div class="item">
            <h3>Item 1</h3>
            <p>Description for Item 1.</p>
        </div>
        <div class="item">
            <h3>Item 2</h3>
            <p>Description for Item 2.</p>
        </div>
        <div class="item">
            <h3>Item 3</h3>
            <p>Description for Item 3.</p>
        </div>
    </div>
</body>
</html>
