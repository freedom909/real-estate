<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        form {
            max-width: 500px;
            margin: 0 auto;
        }
        label {
            display: block;
            margin-top: 10px;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Book a Subgraph</h1>
    <form id="bookingForm">
        <input type="hidden" id="subgraphName">
        <label for="name">Full Name:</label>
        <input type="text" id="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" required>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" required>

        <label for="date">Booking Date:</label>
        <input type="date" id="date" required>

        <label for="notes">Additional Notes:</label>
        <textarea id="notes" rows="4"></textarea>

        <button type="submit">Submit Booking</button>
    </form>

    <script>
        // Get subgraph name from URL
        const urlParams = new URLSearchParams(window.location.search);
        const subgraphName = urlParams.get('subgraph');
        document.getElementById('subgraphName').value = subgraphName;
        document.querySelector('h1').textContent += `: ${subgraphName}`;

        // Handle form submission
        document.getElementById('bookingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = {
                subgraph: subgraphName,
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                date: document.getElementById('date').value,
                notes: document.getElementById('notes').value
            };
            
            // Here you would typically send the data to your backend
            console.log('Booking submitted:', formData);
            alert('Booking submitted successfully! We will contact you shortly.');
            window.location.href = 'subgraph-listings.html';
        });
    </script>
</body>
</html>
