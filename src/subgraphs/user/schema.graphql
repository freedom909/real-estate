schema
  @link(
    url: "https://specs.apollo.dev/federation/v2.11"
    import: ["@key"]
  ) {
  query: Query
  mutation: Mutation
}

scalar DateTime

"""
User subgraph 是 User 的唯一 owner
"""
type User @key(fields: "id") {
  id: ID!
  email: String
  role: UserRole!
  profile: UserProfile
  status: UserStatus!
  createdAt: DateTime!
}

type UserProfile {
  name: String
  avatar: String
}

enum UserRole {
  USER
  ADMIN
}

enum UserStatus {
  ACTIVE
  DEACTIVATED
}

type Query {
  userByEmail(email: String!): User
  userById(id: ID!): User
}

type Mutation {
  createOAuthUser(input: CreateOAuthUserInput!): User!
  deactivateUser(userId: ID!): Boolean!
}

input CreateOAuthUserInput {
  email: String!
  profile: UserProfileInput
}

input UserProfileInput {
  name: String
  avatar: String
}