enum OAuthProvider {
  GOOGLE
  GITHUB
  FACEBOOK
}

input OAuthUserInput {
  provider: OAuthProvider!
  providerUserId: String!
  email: String
  name: String
  avatar: String
}

type User @key(fields: "id") {
  id: ID!
  email: String!
  role: Role!
}

extend type Mutation {
  findOrCreateByOAuth(input: OAuthUserInput!): User!
}

enum Role {
  GUEST
  AGENT
  USER
  ADMIN
  PENDING_AGENT
}


