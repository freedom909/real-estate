schema
  @link(
    url: "https://specs.apollo.dev/federation/v2.11"
    import: ["@key", "@shareable"]
  ) {
  query: Query
  mutation: Mutation
}

scalar DateTime

"""
User subgraph 是 User 的唯一 owner
"""
type User @key(fields: "id") {
  id: ID! 
  profile: Profile! 
  email: String!
  role: Role! 
  accountStatus: AccountStatus! 
  approvalStatus: ApprovalStatus! 
  tokenVersion: Int!
  createdAt: DateTime! 
}


type Profile @shareable {
  name: String
  avatar: String
}

enum Role {
  ADMIN
  AGENT
  OWNER
  CUSTOMER
}

enum AccountStatus {
  ACTIVE
  BANNED
  SUSPENDED
  DELETED
}

enum ApprovalStatus {
  NONE
  PENDING
  APPROVED
  REJECTED
}

type Query {
  userByEmail(email: String!): User
  userById(id: ID!): User
}

type Mutation {
  createOAuthUser(input: CreateOAuthUserInput!): User!
  deactivateUser(userId: ID!): Boolean!
}

input CreateOAuthUserInput {
  email: String!
  profile: ProfileInput
}

input ProfileInput {
  name: String
  avatar: String
}