
enum OAuthProvider {
  GOOGLE
  GITHUB
  APPLE
  LINE
  LOCAL
}
enum Role {
  USER
  AGENT
  ADMIN
}


type User {
  userId: ID!
  email: String
  fullname: String
  picture: String
  role: String
}

input OAuthUserInput {
  provider: OAuthProvider!
  providerSub: String!
  email: String
  fullname: String
  picture: String
}

type Query {
  user(userId: ID!): User
  userByEmail(email: String!): User
}

type Mutation {
  findOrCreateOAuthUser(input: OAuthUserInput!): User!
}
