extend schema
  @link(
    url: "https://specs.apollo.dev/federation/v2.11"
    import: ["@key"]
  )

scalar DateTime

directive @auth(requires: [Role!] = []) on FIELD_DEFINITION | OBJECT
directive @public on FIELD_DEFINITION

# =====================
# User (REFERENCE ONLY)
# =====================
type User @key(fields: "id") {
  id: ID!
}

# =====================
# Auth-only Role
# (used ONLY for authorization, NOT user data)
# =====================
enum Role {
  ADMIN
  AGENT
  USER
  GUEST
  PENDING_AGENT
}

# =====================
# OAuth Provider
# =====================
enum OAuthProvider {
  GOOGLE
  FACEBOOK
  GITHUB
  APPLE
  LINE
}

# =====================
# Query
# =====================
type Query {
  me: User @auth
  
}

# =====================
# Mutation
# =====================
type Mutation {
  oauthLogin(
    provider: OAuthProvider!
    idToken: String!
  ): AuthPayload! @public

  bindOAuth(
    provider: OAuthProvider!
    idToken: String!
  ): User! @auth

  unbindOAuth(
    provider: OAuthProvider!
  ): User! @auth

  refreshToken(
    refreshToken: String!
  ): AuthTokens!

  adminMergeAccounts(
    fromUserId: ID!
    toUserId: ID!
    reason: String!
  ): AdminMergeResult!
    @auth(requires: [ADMIN])

  adminPreviewMerge(
    fromUserId: ID!
    toUserId: ID!
  ): AdminMergePreview!
    @auth(requires: [ADMIN])
}

# =====================
# Payloads
# =====================
type AuthPayload {
  user: User!
  accessToken: String!
  refreshToken: String!
}

type AuthTokens {
  accessToken: String!
  refreshToken: String!
}

# =====================
# Admin / Audit Types
# =====================
type AdminMergeResult {
  success: Boolean!
  mergedFrom: ID!
  mergedInto: ID!
}

type RiskEvent {
  userId: ID!
  type: String
  provider: OAuthProvider
  ip: String
  userAgent: String
  createdAt: DateTime
  deviceId: String
}

type AdminMergePreview {
  fromUser: MergeUserSnapshot!
  toUser: MergeUserSnapshot!

  credentialsToMove: [CredentialPreview!]!
  refreshTokensToMove: Int!

  warnings: [String!]!
  mergeAllowed: Boolean!
}

# ⚠️ These are SNAPSHOTS, not User
type MergeUserSnapshot {
  userId: ID!
  email: String
  role: Role!
  createdAt: DateTime
  credentialCount: Int!
  providers: [OAuthProvider!]!
}

type CredentialPreview {
  id: ID!
  provider: OAuthProvider!
  email: String
  lastLoginAt: DateTime
}
