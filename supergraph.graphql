schema
  @link(url: "https://specs.apollo.dev/link/v1.0")
  @link(url: "https://specs.apollo.dev/join/v0.5", for: EXECUTION)
{
  query: Query
  mutation: Mutation
}

directive @join__directive(graphs: [join__Graph!], name: String!, args: join__DirectiveArguments) repeatable on SCHEMA | OBJECT | INTERFACE | FIELD_DEFINITION

directive @join__enumValue(graph: join__Graph!) repeatable on ENUM_VALUE

directive @join__field(graph: join__Graph, requires: join__FieldSet, provides: join__FieldSet, type: String, external: Boolean, override: String, usedOverridden: Boolean, overrideLabel: String, contextArguments: [join__ContextArgument!]) repeatable on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

directive @join__graph(name: String!, url: String!) on ENUM_VALUE

directive @join__implements(graph: join__Graph!, interface: String!) repeatable on OBJECT | INTERFACE

directive @join__type(graph: join__Graph!, key: join__FieldSet, extension: Boolean! = false, resolvable: Boolean! = true, isInterfaceObject: Boolean! = false) repeatable on OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR

directive @join__unionMember(graph: join__Graph!, member: String!) repeatable on UNION

directive @link(url: String, as: String, for: link__Purpose, import: [link__Import]) repeatable on SCHEMA

enum AccountStatus
  @join__type(graph: USER)
{
  ACTIVE @join__enumValue(graph: USER)
  BANNED @join__enumValue(graph: USER)
  SUSPENDED @join__enumValue(graph: USER)
  DELETED @join__enumValue(graph: USER)
}

type AdminMergePreview
  @join__type(graph: AUTH)
{
  fromUser: MergeUserSnapshot!
  toUser: MergeUserSnapshot!
  credentialsToMove: [CredentialPreview!]!
  refreshTokensToMove: Int!
  warnings: [String!]!
  mergeAllowed: Boolean!
}

type AdminMergeResult
  @join__type(graph: AUTH)
{
  success: Boolean!
  mergedFrom: ID!
  mergedInto: ID!
}

enum ApprovalStatus
  @join__type(graph: PROPERTY)
  @join__type(graph: USER)
{
  NONE @join__enumValue(graph: PROPERTY) @join__enumValue(graph: USER)
  PENDING @join__enumValue(graph: PROPERTY) @join__enumValue(graph: USER)
  APPROVED @join__enumValue(graph: PROPERTY) @join__enumValue(graph: USER)
  REJECTED @join__enumValue(graph: PROPERTY) @join__enumValue(graph: USER)
}

type AuthPayload
  @join__type(graph: AUTH)
{
  user: User!
  accessToken: String!
}

type AuthTokens
  @join__type(graph: AUTH)
{
  accessToken: String!
}

input CreateOAuthUserInput
  @join__type(graph: USER)
{
  email: String!
  profile: ProfileInput
}

type CredentialPreview
  @join__type(graph: AUTH)
{
  id: ID!
  provider: OAuthProvider!
  email: String
  lastLoginAt: DateTime
}

scalar DateTime
  @join__type(graph: AUTH)
  @join__type(graph: PROPERTY)
  @join__type(graph: USER)

input join__ContextArgument {
  name: String!
  type: String!
  context: String!
  selection: join__FieldValue!
}

scalar join__DirectiveArguments

scalar join__FieldSet

scalar join__FieldValue

enum join__Graph {
  AUTH @join__graph(name: "auth", url: "http://localhost:4010/graphql")
  PROPERTY @join__graph(name: "property", url: "http://localhost:4030/graphql")
  USER @join__graph(name: "user", url: "http://localhost:4020/graphql")
}

scalar link__Import

enum link__Purpose {
  """
  `SECURITY` features provide metadata necessary to securely resolve fields.
  """
  SECURITY

  """
  `EXECUTION` features provide metadata necessary for operation execution.
  """
  EXECUTION
}

type MergeUserSnapshot
  @join__type(graph: AUTH)
{
  userId: ID!
  email: String
  role: Role!
  createdAt: DateTime
  credentialCount: Int!
  providers: [OAuthProvider!]!
}

type Mutation
  @join__type(graph: AUTH)
  @join__type(graph: PROPERTY)
  @join__type(graph: USER)
{
  oauthLogin(provider: OAuthProvider!, idToken: String!): AuthPayload! @join__field(graph: AUTH)
  refreshToken: AuthTokens! @join__field(graph: AUTH)
  logout: Boolean! @join__field(graph: AUTH)
  revokeToken: Boolean! @join__field(graph: AUTH)
  bindOAuth(provider: OAuthProvider!, idToken: String!): User! @join__field(graph: AUTH)
  unbindOAuth(provider: OAuthProvider!): User! @join__field(graph: AUTH)
  revokeSession(sessionId: String!): Boolean! @join__field(graph: AUTH)
  createProperty(title: String!, price: Int!): Property @join__field(graph: PROPERTY)
  deleteProperty(id: ID!): Boolean @join__field(graph: PROPERTY)
  createOAuthUser(input: CreateOAuthUserInput!): User! @join__field(graph: USER)
  deactivateUser(userId: ID!): Boolean! @join__field(graph: USER)
}

enum OAuthProvider
  @join__type(graph: AUTH)
{
  GOOGLE @join__enumValue(graph: AUTH)
  FACEBOOK @join__enumValue(graph: AUTH)
  GITHUB @join__enumValue(graph: AUTH)
  APPLE @join__enumValue(graph: AUTH)
}

